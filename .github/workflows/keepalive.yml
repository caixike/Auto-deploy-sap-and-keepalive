name: Anynines App Keepalive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    name: Ping Apps to Keep Alive
    continue-on-error: true

    steps:
    - name: Ping App 1 (proxybxssde)
      run: |
        echo "=== 保活: a9s-proxybxssde ==="
        for i in 1 2 3; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://a9s-proxybxssde.de.a9sapp.eu" || echo "000")
          echo "第${i}次请求 HTTP状态码: $HTTP_CODE"
          if [ "$HTTP_CODE" != "000" ]; then
            echo "App 1 在线 (HTTP $HTTP_CODE)"
            break
          fi
          echo "等待10秒后重试..."
          sleep 10
        done

    - name: Ping App 1 Sub Endpoint
      run: |
        echo "=== 保活订阅端点: a9s-proxybxssde/sub ==="
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://a9s-proxybxssde.de.a9sapp.eu/sub" || echo "000")
        echo "HTTP状态码: $HTTP_CODE"
        if [ "$HTTP_CODE" = "200" ]; then
          echo "订阅端点正常"
        else
          echo "订阅端点异常 (HTTP $HTTP_CODE)"
        fi

    - name: Ping App 2 (proxyglxdcn)
      run: |
        echo "=== 保活: a9s-proxyglxdcn ==="
        for i in 1 2 3; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://a9s-proxyglxdcn.de.a9sapp.eu" || echo "000")
          echo "第${i}次请求 HTTP状态码: $HTTP_CODE"
          if [ "$HTTP_CODE" != "000" ]; then
            echo "App 2 在线 (HTTP $HTTP_CODE)"
            break
          fi
          echo "等待10秒后重试..."
          sleep 10
        done

    - name: Ping App 2 Sub Endpoint
      run: |
        echo "=== 保活订阅端点: a9s-proxyglxdcn/sub ==="
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://a9s-proxyglxdcn.de.a9sapp.eu/sub" || echo "000")
        echo "HTTP状态码: $HTTP_CODE"
        if [ "$HTTP_CODE" = "200" ]; then
          echo "订阅端点正常"
        else
          echo "订阅端点异常 (HTTP $HTTP_CODE)"
        fi

    - name: Summary
      if: always()
      run: |
        echo "========== 保活结果摘要 =========="
        echo "保活时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "保活方式: HTTP ping (适用于 Anynines 平台)"
        echo "保活间隔: 每6小时"
        echo "App 1: https://a9s-proxybxssde.de.a9sapp.eu"
        echo "App 2: https://a9s-proxyglxdcn.de.a9sapp.eu"
        echo "=================================="
